[package]
name = "optionfactory-posture"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6", features = ["derive", "env"] }
ring = "0.17"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "fs", "time", "signal"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
